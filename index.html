<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #08090c;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  canvas { display: block; }

  /* ---------- HUD 层 ---------- */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* 品牌标题 */
  .brand {
    position: absolute;
    top: 30px; left: 34px;
    color: rgba(255,255,255,0.92);
    user-select: none;
  }
  .brand h1 {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
  }
  .brand p {
    margin-top: 7px;
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.36);
  }

  /* 工具栏按钮 */
  .toolbar {
    position: absolute;
    top: 26px; right: 26px;
    display: flex;
    gap: 10px;
  }
  .toolbar button {
    width: 46px; height: 46px;
    border-radius: 15px;
    background: rgba(255,255,255,0.065);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px) saturate(1.7);
    -webkit-backdrop-filter: blur(20px) saturate(1.7);
    color: rgba(255,255,255,0.82);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .25s ease, transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .toolbar button:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }
  .toolbar button:active { transform: translateY(0) scale(0.96); }
  .toolbar button.active {
    background: rgba(110,175,255,0.26);
    border-color: rgba(130,190,255,0.55);
    color: #ffffff;
    box-shadow: 0 0 22px rgba(90,160,255,0.28);
  }

  /* 颜色选择区 */
  .swatches {
    position: absolute;
    bottom: 38px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 13px 22px;
    border-radius: 999px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(22px) saturate(1.7);
    -webkit-backdrop-filter: blur(22px) saturate(1.7);
    pointer-events: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }

  .swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.22);
    cursor: pointer;
    position: relative;
    transition: transform .24s cubic-bezier(.34,1.56,.64,1), box-shadow .24s ease;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 -3px 8px rgba(0,0,0,0.35), inset 0 3px 7px rgba(255,255,255,0.35);
  }
  .swatch:hover { transform: scale(1.14); }
  .swatch.active {
    transform: scale(1.1);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.85),
                inset 0 -3px 8px rgba(0,0,0,0.35),
                inset 0 3px 7px rgba(255,255,255,0.35);
  }

  /* 提示文字 */
  .hint {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.26);
    white-space: nowrap;
    user-select: none;
  }

  /* 加载层 */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #08090c;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 0.25em;
    transition: opacity .7s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }

  /* ---------- 移动端适配 ---------- */
  @media (max-width: 720px) {
    .brand { top: 20px; left: 20px; }
    .brand h1 { font-size: 14px; }
    .brand p { font-size: 9px; }

    .toolbar { top: 16px; right: 16px; gap: 8px; }
    .toolbar button { width: 42px; height: 42px; border-radius: 13px; font-size: 17px; }

    .swatches { bottom: 52px; gap: 12px; padding: 11px 17px; }
    .swatch { width: 26px; height: 26px; }

    .hint { bottom: 22px; font-size: 9.5px; }
  }
</style>

<!-- ==================== importmap ==================== -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<!-- ==================== 主程序 ==================== -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls }      from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment }    from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================================
 * 1. 全局参数区 —— 修改这里即可调整整机比例
 * ========================================================================= */
const PHONE_WIDTH   = 7.5;    // 机身宽度
const PHONE_HEIGHT  = 15.5;   // 机身高度
const PHONE_DEPTH   = 0.82;   // 机身厚度（约 8mm 的真实比例）
const CORNER_RADIUS = 1.12;   // 机身圆角半径

const FRONT_Z =  PHONE_DEPTH / 2;   // 正面玻璃基准面
const BACK_Z  = -PHONE_DEPTH / 2;   // 背面玻璃基准面

/* =========================================================================
 * 2. 通用几何工具
 * ========================================================================= */

/**
 * 生成圆角矩形 Shape（用于 ExtrudeGeometry）
 */
function roundedRectShape(w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  const s = new THREE.Shape();
  const x = -w / 2;
  const y = -h / 2;

  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);

  return s;
}

/**
 * 生成一块「圆角矩形薄板」几何体（自带微小倒角，厚度沿 Z 轴，几何中心在原点）
 * @param {number} w 宽
 * @param {number} h 高
 * @param {number} r 圆角半径
 * @param {number} thickness 厚度
 * @param {number} bevel 倒角尺寸
 */
function makePlate(w, h, r, thickness, bevel = 0.015) {
  const shape = roundedRectShape(w, h, r);
  const bt = Math.min(bevel, thickness / 2 - 0.0005, r * 0.4);
  const depth = Math.max(thickness - 2 * bt, 0.001);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelThickness: bt,
    bevelSize: bt,
    bevelSegments: 2,
    curveSegments: 28
  });

  // 让几何体沿 Z 轴居中
  geo.translate(0, 0, -depth / 2);
  geo.computeVertexNormals();
  return geo;
}

/* =========================================================================
 * 3. 材质管理（统一引用，颜色切换时直接改这些材质的 color）
 * ========================================================================= */
const MAT = {
  // 金属中框（高金属度 + 清漆层）
  frame: new THREE.MeshPhysicalMaterial({
    color: 0x3c3f45,
    metalness: 1.0,
    roughness: 0.22,
    clearcoat: 0.4,
    clearcoatRoughness: 0.28,
    envMapIntensity: 1.25
  }),

  // 玻璃后盖（磨砂玻璃质感 + 清漆）
  backGlass: new THREE.MeshPhysicalMaterial({
    color: 0x1c1f24,
    metalness: 0.55,
    roughness: 0.36,
    clearcoat: 1.0,
    clearcoatRoughness: 0.1,
    envMapIntensity: 1.05
  }),

  // 正面玻璃（黑，高反光）
  frontGlass: new THREE.MeshPhysicalMaterial({
    color: 0x0a0b0e,
    metalness: 0.25,
    roughness: 0.045,
    clearcoat: 1.0,
    clearcoatRoughness: 0.02,
    envMapIntensity: 1.5
  }),

  // 屏幕显示面（纯黑，极强反射）
  display: new THREE.MeshPhysicalMaterial({
    color: 0x000000,
    metalness: 0.0,
    roughness: 0.03,
    clearcoat: 1.0,
    clearcoatRoughness: 0.015,
    envMapIntensity: 1.9
  }),

  // 摄像头金属圈
  lensRing: new THREE.MeshPhysicalMaterial({
    color: 0x2b2e34,
    metalness: 1.0,
    roughness: 0.16,
    clearcoat: 0.5,
    clearcoatRoughness: 0.2,
    envMapIntensity: 1.3
  }),

  // 镜头玻璃
  lensGlass: new THREE.MeshPhysicalMaterial({
    color: 0x05070b,
    metalness: 0.0,
    roughness: 0.015,
    clearcoat: 1.0,
    clearcoatRoughness: 0.0,
    envMapIntensity: 2.4,
    ior: 1.85,
    reflectivity: 1.0
  }),

  // 深色塑料 / 开孔
  dark: new THREE.MeshPhysicalMaterial({
    color: 0x08090b,
    metalness: 0.25,
    roughness: 0.55,
    clearcoat: 0.3,
    clearcoatRoughness: 0.5
  }),

  // 闪光灯
  flash: new THREE.MeshPhysicalMaterial({
    color: 0xfff3dd,
    emissive: 0x3a2f1e,
    emissiveIntensity: 0.6,
    metalness: 0.0,
    roughness: 0.15,
    clearcoat: 1.0
  })
};

/* =========================================================================
 * 4. 颜色方案
 * ========================================================================= */
const COLORS = [
  { name: '深空黑', frame: 0x3a3d43, back: 0x191b20, ui: 'linear-gradient(145deg,#5a5e66,#22252a)' },
  { name: '银色',   frame: 0xd3d6db, back: 0xe2e5ea, ui: 'linear-gradient(145deg,#ffffff,#b9bdc4)' },
  { name: '金色',   frame: 0xd6b586, back: 0xe6d3b0, ui: 'linear-gradient(145deg,#f3ddb8,#c39c6b)' },
  { name: '深蓝',   frame: 0x2a4165, back: 0x14203a, ui: 'linear-gradient(145deg,#3d5c8c,#132039)' },
  { name: '玫瑰金', frame: 0xdbaa9d, back: 0xecc5b9, ui: 'linear-gradient(145deg,#f6d3c8,#c48e82)' }
];

// 当前颜色 / 目标颜色（用于平滑 lerp 过渡）
const curFrame = new THREE.Color(COLORS[0].frame);
const tgtFrame = new THREE.Color(COLORS[0].frame);
const curBack  = new THREE.Color(COLORS[0].back);
const tgtBack  = new THREE.Color(COLORS[0].back);

MAT.frame.color.copy(curFrame);
MAT.backGlass.color.copy(curBack);

/* =========================================================================
 * 5. 渲染器 / 场景 / 相机
 * ========================================================================= */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// 程序化生成竖直渐变背景
(function buildBackground() {
  const c = document.createElement('canvas');
  c.width = 4;
  c.height = 512;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.00, '#343a43');
  grad.addColorStop(0.42, '#1b1f26');
  grad.addColorStop(1.00, '#07080a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 4, 512);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);
const CAM_START = new THREE.Vector3(9, 6, 30);
camera.position.copy(CAM_START);

/* =========================================================================
 * 6. 环境贴图（RoomEnvironment 提供真实的产品摄影棚反射）
 * ========================================================================= */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;

/* =========================================================================
 * 7. 灯光
 * ========================================================================= */
function buildLights() {
  // 天空 / 地面 环境光
  const hemi = new THREE.HemisphereLight(0xffffff, 0x1a1d22, 0.55);
  scene.add(hemi);

  // 主光（产生阴影）
  const key = new THREE.DirectionalLight(0xffffff, 3.4);
  key.position.set(14, 24, 18);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 90;
  key.shadow.camera.left   = -20;
  key.shadow.camera.right  =  20;
  key.shadow.camera.top    =  20;
  key.shadow.camera.bottom = -20;
  key.shadow.bias = -0.0006;
  key.shadow.normalBias = 0.02;
  key.shadow.radius = 4;
  scene.add(key);

  // 冷色补光（左侧）
  const fill = new THREE.DirectionalLight(0x9dc4ff, 1.5);
  fill.position.set(-20, 8, 16);
  scene.add(fill);

  // 轮廓光（背后）
  const rim = new THREE.DirectionalLight(0xffffff, 2.0);
  rim.position.set(-8, 12, -24);
  scene.add(rim);

  // 底部反弹光
  const bounce = new THREE.DirectionalLight(0xffffff, 0.45);
  bounce.position.set(2, -16, 12);
  scene.add(bounce);
}
buildLights();

/* =========================================================================
 * 8. 手机模型构建
 * ========================================================================= */
const phoneGroup = new THREE.Group();
scene.add(phoneGroup);

/* -------------------- 8.1 机身中框 -------------------- */
function buildBody() {
  const g = new THREE.Group();
  const bevel = 0.07;                       // 中框前后倒角
  const depth = PHONE_DEPTH - bevel * 2;

  const shape = roundedRectShape(PHONE_WIDTH, PHONE_HEIGHT, CORNER_RADIUS);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelThickness: bevel,
    bevelSize: bevel,
    bevelSegments: 3,
    curveSegments: 30
  });

  // 让几何体沿 Z 轴居中：总厚度 = depth + 2 * bevel = PHONE_DEPTH
  geo.translate(0, 0, -depth / 2);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, MAT.frame);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  g.add(mesh);

  return g;
}

/* -------------------- 8.2 玻璃后盖 -------------------- */
function buildBackGlass() {
  const g = new THREE.Group();
  const t = 0.08;

  const geo = makePlate(
    PHONE_WIDTH - 0.16,
    PHONE_HEIGHT - 0.16,
    CORNER_RADIUS - 0.08,
    t,
    0.02
  );

  const mesh = new THREE.Mesh(geo, MAT.backGlass);
  // 后表面稍微超出金属中框一点点，形成玻璃盖在中框上的效果
  mesh.position.z = BACK_Z + t / 2 - 0.005;
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  g.add(mesh);
  return g;
}

/* -------------------- 8.3 正面屏幕 -------------------- */
function buildScreen() {
  const g = new THREE.Group();

  /* --- 正面黑色玻璃面板（覆盖整个正面） --- */
  const glassT = 0.07;
  const glassGeo = makePlate(
    PHONE_WIDTH - 0.12,
    PHONE_HEIGHT - 0.12,
    CORNER_RADIUS - 0.06,
    glassT,
    0.02
  );
  const glass = new THREE.Mesh(glassGeo, MAT.frontGlass);
  glass.position.z = FRONT_Z - glassT / 2 + 0.012;  // 前表面 = FRONT_Z + 0.012
  g.add(glass);

  /* --- 显示区域（比边框略小，形成极窄黑边） --- */
  const dispT = 0.012;
  const dispGeo = makePlate(
    PHONE_WIDTH - 0.42,
    PHONE_HEIGHT - 0.42,
    CORNER_RADIUS - 0.21,
    dispT,
    0.004
  );
  const disp = new THREE.Mesh(dispGeo, MAT.display);
  disp.position.z = FRONT_Z + 0.015;   // 略高于玻璃面板
  g.add(disp);

  /* --- 灵动岛 --- */
  const islandGeo = makePlate(1.5, 0.44, 0.22, 0.02, 0.005);
  const island = new THREE.Mesh(islandGeo, MAT.frontGlass);
  island.position.set(0, PHONE_HEIGHT / 2 - 1.35, FRONT_Z + 0.023);
  g.add(island);

  /* --- 底部 Home 指示条 --- */
  const barGeo = makePlate(2.6, 0.16, 0.08, 0.01, 0.003);
  const bar = new THREE.Mesh(barGeo, MAT.frontGlass);
  bar.position.set(0, -PHONE_HEIGHT / 2 + 0.95, FRONT_Z + 0.023);
  g.add(bar);

  return g;
}

/* -------------------- 8.4 后置摄像头模组 -------------------- */
function buildCameraModule() {
  const g = new THREE.Group();

  const M_W = 3.05, M_H = 3.05, M_R = 0.72;
  const M_CX = -PHONE_WIDTH / 2 + M_W / 2 + 0.42;   // 左上角
  const M_CY =  PHONE_HEIGHT / 2 - M_H / 2 - 0.95;

  const MODULE_BACK_Z = BACK_Z - 0.19;   // 模组最外侧平面

  /* --- 金属边框（略大，从底座后侧透出一圈金属） --- */
  const rimGeo = makePlate(M_W + 0.13, M_H + 0.13, M_R + 0.04, 0.10, 0.02);
  const rim = new THREE.Mesh(rimGeo, MAT.frame);
  rim.position.set(M_CX, M_CY, MODULE_BACK_Z + 0.05);
  rim.castShadow = true;
  g.add(rim);

  /* --- 模组玻璃底座（凸起） --- */
  const baseT = 0.26;
  const baseGeo = makePlate(M_W, M_H, M_R, baseT, 0.035);
  const base = new THREE.Mesh(baseGeo, MAT.backGlass);
  base.position.set(M_CX, M_CY, MODULE_BACK_Z + baseT / 2 + 0.02);
  base.castShadow = true;
  base.receiveShadow = true;
  g.add(base);

  /* --- 单个镜头生成函数 --- */
  function makeLens(ox, oy) {
    const lens = new THREE.Group();

    // 金属外圈（实心圆柱，正面会被内圈盖住，只露出一圈金属环）
    const ringGeo = new THREE.CylinderGeometry(0.56, 0.56, 0.16, 48);
    ringGeo.rotateX(Math.PI / 2);
    const ring = new THREE.Mesh(ringGeo, MAT.lensRing);
    ring.position.z = MODULE_BACK_Z - 0.06;
    ring.castShadow = true;
    lens.add(ring);

    // 内圈镜筒（深色）
    const barrelGeo = new THREE.CylinderGeometry(0.46, 0.46, 0.20, 48);
    barrelGeo.rotateX(Math.PI / 2);
    const barrel = new THREE.Mesh(barrelGeo, MAT.dark);
    barrel.position.z = MODULE_BACK_Z - 0.10;
    lens.add(barrel);

    // 镜头玻璃
    const glassGeo = new THREE.CylinderGeometry(0.40, 0.40, 0.03, 48);
    glassGeo.rotateX(Math.PI / 2);
    const glass = new THREE.Mesh(glassGeo, MAT.lensGlass);
    glass.position.z = MODULE_BACK_Z - 0.205;
    lens.add(glass);

    lens.position.set(M_CX + ox, M_CY + oy, 0);
    return lens;
  }

  // 三摄三角形排布
  g.add(makeLens(-0.62,  0.62));
  g.add(makeLens(-0.62, -0.62));
  g.add(makeLens( 0.62,  0.10));

  /* --- 闪光灯 --- */
  const flashGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.08, 24);
  flashGeo.rotateX(Math.PI / 2);
  const flash = new THREE.Mesh(flashGeo, MAT.flash);
  flash.position.set(M_CX + 0.62, M_CY - 0.85, MODULE_BACK_Z - 0.04);
  g.add(flash);

  /* --- LiDAR / 传感器 --- */
  const lidarGeo = new THREE.CylinderGeometry(0.10, 0.10, 0.06, 24);
  lidarGeo.rotateX(Math.PI / 2);
  const lidar = new THREE.Mesh(lidarGeo, MAT.dark);
  lidar.position.set(M_CX + 0.62, M_CY + 0.95, MODULE_BACK_Z - 0.03);
  g.add(lidar);

  return g;
}

/* -------------------- 8.5 侧边按键 -------------------- */
function buildButtons() {
  const g = new THREE.Group();

  const SIDE_X = PHONE_WIDTH / 2 - 0.01;
  const BW = 0.14;   // 按键宽度（凸出机身的量）
  const BD = 0.40;   // 按键纵深

  /* --- 右侧：电源键 --- */
  const power = new THREE.Mesh(
    new RoundedBoxGeometry(BW, 2.0, BD, 3, 0.055),
    MAT.frame
  );
  power.position.set(SIDE_X, 1.8, 0);
  power.castShadow = true;
  g.add(power);

  /* --- 左侧：静音拨片 --- */
  const mute = new THREE.Mesh(
    new RoundedBoxGeometry(BW, 0.55, BD, 3, 0.055),
    MAT.frame
  );
  mute.position.set(-SIDE_X, 4.55, 0);
  mute.castShadow = true;
  g.add(mute);

  /* --- 左侧：音量 + --- */
  const volUp = new THREE.Mesh(
    new RoundedBoxGeometry(BW, 1.35, BD, 3, 0.055),
    MAT.frame
  );
  volUp.position.set(-SIDE_X, 2.85, 0);
  volUp.castShadow = true;
  g.add(volUp);

  /* --- 左侧：音量 - --- */
  const volDown = new THREE.Mesh(
    new RoundedBoxGeometry(BW, 1.35, BD, 3, 0.055),
    MAT.frame
  );
  volDown.position.set(-SIDE_X, 1.25, 0);
  volDown.castShadow = true;
  g.add(volDown);

  return g;
}

/* -------------------- 8.6 底部接口 / 顶部麦克风 -------------------- */
function buildPorts() {
  const g = new THREE.Group();

  const BOTTOM_Y = -PHONE_HEIGHT / 2;
  const TOP_Y    =  PHONE_HEIGHT / 2;

  /* --- USB-C 接口（深色凹槽 + 内部金属舌片） --- */
  const portGeo = new RoundedBoxGeometry(1.15, 0.06, 0.44, 3, 0.025);
  const port = new THREE.Mesh(portGeo, MAT.dark);
  port.position.set(0, BOTTOM_Y + 0.03, 0);
  g.add(port);

  // 内部金属触点
  const tongueGeo = new RoundedBoxGeometry(0.86, 0.035, 0.26, 2, 0.012);
  const tongue = new THREE.Mesh(tongueGeo, MAT.frame);
  tongue.position.set(0, BOTTOM_Y + 0.028, 0);
  g.add(tongue);

  /* --- 底部扬声器开孔（左右各一排） --- */
  const holeGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.06, 10);
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 6; i++) {
      const hole = new THREE.Mesh(holeGeo, MAT.dark);
      hole.position.set(side * (0.95 + i * 0.2), BOTTOM_Y + 0.03, 0);
      g.add(hole);
    }
  }

  /* --- 底部麦克风小孔 --- */
  const micGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.06, 10);
  const mic = new THREE.Mesh(micGeo, MAT.dark);
  mic.position.set(-2.45, BOTTOM_Y + 0.03, 0);
  g.add(mic);

  /* --- 顶部麦克风小孔 --- */
  const micTop = new THREE.Mesh(micGeo, MAT.dark);
  micTop.position.set(1.6, TOP_Y - 0.03, 0);
  g.add(micTop);

  return g;
}

/* -------------------- 组装手机 -------------------- */
phoneGroup.add(buildBody());
phoneGroup.add(buildBackGlass());
phoneGroup.add(buildScreen());
phoneGroup.add(buildCameraModule());
phoneGroup.add(buildButtons());
phoneGroup.add(buildPorts());

/* =========================================================================
 * 9. 展示台（承接阴影）
 * ========================================================================= */
function buildStage() {
  const platformGeo = new THREE.CylinderGeometry(11.5, 12.2, 0.7, 96);
  const platformMat = new THREE.MeshPhysicalMaterial({
    color: 0x14171c,
    metalness: 0.18,
    roughness: 0.62,
    clearcoat: 0.45,
    clearcoatRoughness: 0.45,
    envMapIntensity: 0.8
  });

  const platform = new THREE.Mesh(platformGeo, platformMat);
  platform.position.y = -PHONE_HEIGHT / 2 - 0.37;
  platform.receiveShadow = true;
  scene.add(platform);
}
buildStage();

/* =========================================================================
 * 10. 交互控制
 * ========================================================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.065;
controls.minDistance     = 4;      // 允许极近距离观察镜头细节
controls.maxDistance     = 70;
controls.target.set(0, 0, 0);
controls.maxPolarAngle   = Math.PI * 0.88;
controls.minPolarAngle   = Math.PI * 0.08;
controls.rotateSpeed     = 0.9;
controls.zoomSpeed       = 0.9;
controls.panSpeed        = 0.8;
controls.autoRotate      = false;
controls.autoRotateSpeed = 1.0;
controls.update();

/* ---------- 10.1 自动旋转开关 ---------- */
let autoRotate = false;
const btnRotate = document.getElementById('btnRotate');

btnRotate.addEventListener('click', () => {
  autoRotate = !autoRotate;
  btnRotate.classList.toggle('active', autoRotate);
});

/* ---------- 10.2 重置视角（平滑补间） ---------- */
const btnReset = document.getElementById('btnReset');
let camAnim = null;

function resetView() {
  camAnim = {
    fromPos: camera.position.clone(),
    toPos:   CAM_START.clone(),
    fromTgt: controls.target.clone(),
    toTgt:   new THREE.Vector3(0, 0, 0),
    t: 0
  };
  controls.enabled = false;
}
btnReset.addEventListener('click', resetView);

/* ---------- 10.3 颜色切换 ---------- */
const swatchesEl = document.getElementById('swatches');
let activeIndex = 0;

COLORS.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'swatch' + (i === 0 ? ' active' : '');
  btn.style.background = c.ui;
  btn.title = c.name;
  btn.setAttribute('aria-label', c.name);
  btn.addEventListener('click', () => selectColor(i));
  swatchesEl.appendChild(btn);
});

function selectColor(index) {
  if (index === activeIndex) return;
  activeIndex = index;

  const c = COLORS[index];
  tgtFrame.set(c.frame);
  tgtBack.set(c.back);

  // 更新 UI 选中状态
  [...swatchesEl.children].forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
}

/* ---------- 10.4 窗口自适应 ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================================
 * 11. 渲染循环
 * ========================================================================= */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  /* --- 颜色平滑过渡（帧率无关的指数插值） --- */
  const k = 1 - Math.pow(0.0015, dt);
  curFrame.lerp(tgtFrame, k);
  curBack.lerp(tgtBack, k);
  MAT.frame.color.copy(curFrame);
  MAT.backGlass.color.copy(curBack);

  /* --- 重置视角补间 --- */
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 2.0);
    // easeOutCubic
    const e = 1 - Math.pow(1 - camAnim.t, 3);

    camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
    controls.target.lerpVectors(camAnim.fromTgt, camAnim.toTgt, e);

    if (camAnim.t >= 1) {
      camAnim = null;
      controls.enabled = true;
    }
  }

  /* --- 自动旋转 --- */
  controls.autoRotate = autoRotate;
  controls.update();

  renderer.render(scene, camera);
}

/* =========================================================================
 * 12. 启动
 * ========================================================================= */
renderer.render(scene, camera);   // 先渲染一帧，避免首帧闪烁
animate();

// 隐藏加载层
requestAnimationFrame(() => {
  const loading = document.getElementById('loading');
  loading.classList.add('hide');
  setTimeout(() => loading.remove(), 800);
});
</script>
