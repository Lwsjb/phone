<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>StarWay 15 Ultra · 3D 展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #08090c;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .brand {
    position: absolute; top: 30px; left: 34px;
    color: rgba(255,255,255,0.92); user-select: none;
  }
  .brand h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.15em; }
  .brand p { margin-top: 6px; font-size: 11px; letter-spacing: 0.2em; color: rgba(255,255,255,0.4); }
  .toolbar { position: absolute; top: 26px; right: 26px; display: flex; gap: 10px; }
  .toolbar button {
    width: 46px; height: 46px; border-radius: 15px;
    background: rgba(255,255,255,0.065); border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: rgba(255,255,255,0.82); font-size: 19px;
    cursor: pointer; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s ease; -webkit-tap-highlight-color: transparent;
  }
  .toolbar button:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
  .toolbar button.active { background: rgba(110,175,255,0.26); border-color: rgba(130,190,255,0.55); color: #fff; }
  .swatches {
    position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 15px; padding: 13px 22px;
    border-radius: 999px; background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    pointer-events: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.22); cursor: pointer;
    transition: transform .24s cubic-bezier(.34,1.56,.64,1), box-shadow .24s ease;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 -3px 8px rgba(0,0,0,0.35), inset 0 3px 7px rgba(255,255,255,0.35);
  }
  .swatch:hover { transform: scale(1.14); }
  .swatch.active {
    transform: scale(1.1);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.85), inset 0 -3px 8px rgba(0,0,0,0.35), inset 0 3px 7px rgba(255,255,255,0.35);
  }
  .hint {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-size: 10.5px; letter-spacing: 0.14em; color: rgba(255,255,255,0.26);
    white-space: nowrap; user-select: none;
  }
  #loading {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: #08090c; color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 0.25em;
    transition: opacity .7s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  @media (max-width: 720px) {
    .brand { top: 20px; left: 20px; } .brand h1 { font-size: 15px; }
    .toolbar { top: 16px; right: 16px; gap: 8px; } .toolbar button { width: 42px; height: 42px; font-size: 17px; }
    .swatches { bottom: 52px; gap: 12px; padding: 11px 17px; } .swatch { width: 26px; height: 26px; }
    .hint { bottom: 22px; font-size: 9.5px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div class="brand"><h1>StarWay 15 Ultra</h1><p>3D PRODUCT VIEWER</p></div>
  <div class="toolbar">
    <button id="btnReset" title="重置视角">⟲</button>
    <button id="btnRotate" title="自动旋转">⟳</button>
  </div>
  <div class="swatches" id="swatches"></div>
  <div class="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
</div>
<div id="loading">正在构建 1:1 高清模型...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }      from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment }    from 'three/addons/environments/RoomEnvironment.js';

/* ===================== 基础参数 ===================== */
const PHONE_WIDTH   = 7.8;
const PHONE_HEIGHT  = 16.5;
const PHONE_DEPTH   = 0.9;
const CORNER_RADIUS = 1.0;
const FRONT_Z =  PHONE_DEPTH / 2;
const BACK_Z  = -PHONE_DEPTH / 2;

/* ===================== 工具函数 ===================== */
function roundedRectShape(w, h, r) {
  r = Math.min(r, w/2, h/2);
  const s = new THREE.Shape();
  const x = -w/2, y = -h/2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function makePlate(w, h, r, thickness, bevel = 0.015) {
  const shape = roundedRectShape(w, h, r);
  const bt = Math.min(bevel, thickness/2 - 0.0005, r*0.4);
  const depth = Math.max(thickness - 2*bt, 0.001);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: bt, bevelSize: bt,
    bevelSegments: 2, curveSegments: 32
  });
  geo.translate(0, 0, -depth/2);
  geo.computeVertexNormals();
  return geo;
}

/* ===================== 材质系统 ===================== */
const MAT = {
  // 边框金属
  frame: new THREE.MeshPhysicalMaterial({ color: 0x3c3f45, metalness: 1.0, roughness: 0.15, clearcoat: 1.0, envMapIntensity: 2.0 }),
  // 后盖玻璃（为了质感，metalness 略高，roughness 极低，产生强烈高光带）
  backGlass: new THREE.MeshPhysicalMaterial({ color: 0xf2f2f2, metalness: 0.6, roughness: 0.02, clearcoat: 1.0, clearcoatRoughness: 0.01, envMapIntensity: 2.5 }),
  // 正面玻璃
  frontGlass: new THREE.MeshPhysicalMaterial({ color: 0x050505, metalness: 0.1, roughness: 0.01, clearcoat: 1.0, envMapIntensity: 2.0 }),
  // 屏幕显示区
  display: new THREE.MeshPhysicalMaterial({ color: 0x000000, metalness: 0.0, roughness: 0.01, clearcoat: 1.0, envMapIntensity: 3.0 }),
  // 极其耀眼的银色金属圈（镜头圈）
  lensRing: new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.05, clearcoat: 1.0, envMapIntensity: 4.0 }),
  // 深邃的蓝紫反光玻璃镜片
  lensGlass: new THREE.MeshPhysicalMaterial({ color: 0x070912, metalness: 0.8, roughness: 0.01, clearcoat: 1.0, envMapIntensity: 5.0 }),
  // 黑色底座/开孔
  dark: new THREE.MeshPhysicalMaterial({ color: 0x010101, metalness: 0.2, roughness: 0.6 }),
  // 右侧灰色副摄/闪光灯/传感器
  greySensor: new THREE.MeshPhysicalMaterial({ color: 0x888888, metalness: 1.0, roughness: 0.2, envMapIntensity: 1.5 }),
  // 左侧长条白色传感器
  whiteSensor: new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0.1, roughness: 0.1, clearcoat: 1.0 })
};

/* ===================== 颜色方案 ===================== */
const COLORS = [
  { name: '极光白', frame: 0xd8d8d8, back: 0xf5f5f5, ui: 'linear-gradient(145deg,#fff,#d0d0d0)' },
  { name: '深海蓝', frame: 0x2a4165, back: 0x0e1a30, ui: 'linear-gradient(145deg,#2a4165,#0a1120)' },
  { name: '星空黑', frame: 0x1a1a1a, back: 0x000000, ui: 'linear-gradient(145deg,#333,#000)' },
  { name: '钛金',   frame: 0xc0b5a0, back: 0xdcd2c0, ui: 'linear-gradient(145deg,#e0d5c0,#a09080)' },
  { name: '玫瑰金', frame: 0xdbaa9d, back: 0xecc5b9, ui: 'linear-gradient(145deg,#f6d3c8,#c48e82)' }
];
const curFrame = new THREE.Color(COLORS[0].frame), tgtFrame = new THREE.Color(COLORS[0].frame);
const curBack  = new THREE.Color(COLORS[0].back),  tgtBack  = new THREE.Color(COLORS[0].back);
MAT.frame.color.copy(curFrame);
MAT.backGlass.color.copy(curBack);

/* ===================== 渲染器与场景 ===================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// 使用极高对比度的渲染，完美还原棚拍效果
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// 干净的纯黑高级灰背景
(function buildBackground() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.00, '#1a1a1a'); grad.addColorStop(0.5, '#0a0a0a'); grad.addColorStop(1.0, '#000000');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 4, 512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 500);
// 默认视角：略微侧倾，与图二展示效果一致
const CAM_START = new THREE.Vector3(6, 4, 30);
camera.position.copy(CAM_START);

// 环境贴图
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;

/* ===================== 专业摄影棚光影 ===================== */
function buildLights() {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x111111, 0.6));
  
  // 主光（右上方，打亮后盖玻璃和镜头环）
  const key = new THREE.DirectionalLight(0xffffff, 4.0);
  key.position.set(15, 20, 15); 
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1; key.shadow.camera.far = 80;
  key.shadow.camera.left = -15; key.shadow.camera.right = 15;
  key.shadow.camera.top = 20; key.shadow.camera.bottom = -20;
  key.shadow.bias = -0.0005;
  scene.add(key);

  // 极强侧光（左上方，用于制造后盖斜向的高光和金属环的耀眼白边）
  const rim = new THREE.DirectionalLight(0xffffff, 8.0);
  rim.position.set(-20, 15, 5); 
  scene.add(rim);

  // 底部补光（消除死黑）
  const fill = new THREE.DirectionalLight(0xaaccff, 1.0); 
  fill.position.set(10, -10, 10); 
  scene.add(fill);
}
buildLights();

/* ===================== 手机模型构建 ===================== */
const phoneGroup = new THREE.Group();
scene.add(phoneGroup);

// 1. 中框
function buildBody() {
  const bevel = 0.1;
  const depth = PHONE_DEPTH - bevel * 2;
  const shape = roundedRectShape(PHONE_WIDTH, PHONE_HEIGHT, CORNER_RADIUS);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel,
    bevelSegments: 3, curveSegments: 32
  });
  geo.translate(0, 0, -depth/2);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, MAT.frame);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

// 2. 后盖
function buildBackGlass() {
  const t = 0.1;
  const geo = makePlate(PHONE_WIDTH - 0.1, PHONE_HEIGHT - 0.1, CORNER_RADIUS - 0.05, t, 0.02);
  const mesh = new THREE.Mesh(geo, MAT.backGlass);
  mesh.position.z = BACK_Z + t/2 - 0.005;
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

// 3. 正面屏幕
function buildScreen() {
  const g = new THREE.Group();
  const glassT = 0.06;
  const glassGeo = makePlate(PHONE_WIDTH - 0.1, PHONE_HEIGHT - 0.1, CORNER_RADIUS - 0.05, glassT, 0.02);
  const glass = new THREE.Mesh(glassGeo, MAT.frontGlass);
  glass.position.z = FRONT_Z - glassT/2 + 0.01;
  g.add(glass);

  const dispT = 0.01;
  const dispGeo = makePlate(PHONE_WIDTH - 0.28, PHONE_HEIGHT - 0.28, CORNER_RADIUS - 0.14, dispT, 0.002);
  const disp = new THREE.Mesh(dispGeo, MAT.display);
  disp.position.z = FRONT_Z + 0.012;
  g.add(disp);

  // 居中打孔前摄
  const holeGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.02, 32);
  holeGeo.rotateX(Math.PI/2);
  const hole = new THREE.Mesh(holeGeo, MAT.lensGlass);
  hole.position.set(0, PHONE_HEIGHT/2 - 1.2, FRONT_Z + 0.02);
  g.add(hole);

  return g;
}

// 4. 背部：1:1 复刻星环模组
function buildCameraModule() {
  const g = new THREE.Group();
  
  // 模组中心坐标
  const M_CY = PHONE_HEIGHT / 2 - 4.5; 
  const M_CX = 0;
  const MODULE_BACK_Z = BACK_Z - 0.25; // 模组凸起高度

  // (1) 外围金属亮环
  const R_OUT = 3.3;
  const ringGeo = new THREE.CylinderGeometry(R_OUT, R_OUT, 0.18, 64);
  ringGeo.rotateX(Math.PI / 2);
  const ring = new THREE.Mesh(ringGeo, MAT.lensRing);
  ring.position.set(M_CX, M_CY, MODULE_BACK_Z + 0.06);
  ring.castShadow = true;
  g.add(ring);

  // (2) 内部纯黑底座
  const R_IN = 3.15;
  const baseGeo = new THREE.CylinderGeometry(R_IN, R_IN, 0.2, 64);
  baseGeo.rotateX(Math.PI / 2);
  const base = new THREE.Mesh(baseGeo, MAT.dark);
  base.position.set(M_CX, M_CY, MODULE_BACK_Z + 0.02);
  g.add(base);

  // --- 左侧：两颗主摄（带有极亮金属环） ---
  function makeBigLens(ox, oy) {
    const lens = new THREE.Group();
    // 金属亮圈
    const ringGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.1, 48);
    ringGeo.rotateX(Math.PI/2);
    const ring = new THREE.Mesh(ringGeo, MAT.lensRing);
    ring.position.z = MODULE_BACK_Z - 0.02;
    lens.add(ring);
    // 黑色镜筒
    const barrelGeo = new THREE.CylinderGeometry(0.65, 0.65, 0.12, 48);
    barrelGeo.rotateX(Math.PI/2);
    const barrel = new THREE.Mesh(barrelGeo, MAT.dark);
    barrel.position.z = MODULE_BACK_Z - 0.03;
    lens.add(barrel);
    // 蓝紫反光镜片
    const glassGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.06, 48);
    glassGeo.rotateX(Math.PI/2);
    const glass = new THREE.Mesh(glassGeo, MAT.lensGlass);
    glass.position.z = MODULE_BACK_Z - 0.08;
    lens.add(glass);

    lens.position.set(M_CX + ox, M_CY + oy, 0);
    return lens;
  }
  // 左上、左下主摄
  g.add(makeBigLens(-1.2,  1.2));
  g.add(makeBigLens(-1.2, -1.2));

  // --- 右侧：两颗灰色副摄 ---
  function makeSmallLens(ox, oy) {
    const lens = new THREE.Group();
    const ringGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.08, 32);
    ringGeo.rotateX(Math.PI/2);
    const ring = new THREE.Mesh(ringGeo, MAT.greySensor);
    ring.position.z = MODULE_BACK_Z - 0.02;
    lens.add(ring);
    
    const barrelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 32);
    barrelGeo.rotateX(Math.PI/2);
    const barrel = new THREE.Mesh(barrelGeo, MAT.dark);
    barrel.position.z = MODULE_BACK_Z - 0.03;
    lens.add(barrel);

    lens.position.set(M_CX + ox, M_CY + oy, 0);
    return lens;
  }
  // 右上、右下副摄
  g.add(makeSmallLens(1.4,  1.1));
  g.add(makeSmallLens(1.4, -1.1));

  // --- 右侧：中间矩形闪光灯 ---
  const flashGeo = new RoundedBoxGeometry(0.5, 0.25, 0.05, 2, 0.05);
  const flash = new THREE.Mesh(flashGeo, MAT.greySensor);
  flash.position.set(M_CX + 1.4, M_CY, MODULE_BACK_Z - 0.02);
  g.add(flash);

  // --- 模组内部左上角的传感器细节 ---
  const sensorBar1 = new RoundedBoxGeometry(0.15, 0.4, 0.02, 2, 0.02);
  const s1 = new THREE.Mesh(sensorBar1, MAT.dark);
  s1.position.set(M_CX - 0.2, M_CY + 1.4, MODULE_BACK_Z - 0.01);
  g.add(s1);

  const sensorBar2 = new RoundedBoxGeometry(0.4, 0.15, 0.02, 2, 0.02);
  const s2 = new THREE.Mesh(sensorBar2, MAT.dark);
  s2.position.set(M_CX + 0.2, M_CY + 1.4, MODULE_BACK_Z - 0.01);
  g.add(s2);

  // --- 【重点】左侧圆环外的小白条闪光灯（原图左下角） ---
  const outerFlashGeo = new RoundedBoxGeometry(0.18, 0.65, 0.06, 3, 0.09);
  const outerFlash = new THREE.Mesh(outerFlashGeo, MAT.whiteSensor);
  // 放在圆环左下方边缘
  outerFlash.position.set(M_CX - 3.2, M_CY - 1.4, MODULE_BACK_Z + 0.08);
  g.add(outerFlash);

  return g;
}

// 5. 按键
function buildButtons() {
  const g = new THREE.Group();
  const SIDE_X = PHONE_WIDTH/2 - 0.01;
  const BW = 0.12, BD = 0.4;

  const volUp = new THREE.Mesh(new RoundedBoxGeometry(BW, 1.5, BD, 3, 0.05), MAT.frame);
  volUp.position.set(SIDE_X, 3.2, 0); volUp.castShadow = true; g.add(volUp);

  const volDown = new THREE.Mesh(new RoundedBoxGeometry(BW, 1.5, BD, 3, 0.05), MAT.frame);
  volDown.position.set(SIDE_X, 1.5, 0); volDown.castShadow = true; g.add(volDown);

  const power = new THREE.Mesh(new RoundedBoxGeometry(BW, 1.7, BD, 3, 0.05), MAT.frame);
  power.position.set(SIDE_X, -1.2, 0); power.castShadow = true; g.add(power);

  return g;
}

// 6. 底部接口
function buildPorts() {
  const g = new THREE.Group();
  const BOTTOM_Y = -PHONE_HEIGHT/2;

  const portGeo = new RoundedBoxGeometry(1.15, 0.06, 0.44, 3, 0.025);
  const port = new THREE.Mesh(portGeo, MAT.dark);
  port.position.set(0, BOTTOM_Y + 0.03, 0); g.add(port);

  const tongueGeo = new RoundedBoxGeometry(0.86, 0.035, 0.26, 2, 0.012);
  const tongue = new THREE.Mesh(tongueGeo, MAT.frame);
  tongue.position.set(0, BOTTOM_Y + 0.028, 0); g.add(tongue);

  return g;
}

phoneGroup.add(buildBody());
phoneGroup.add(buildBackGlass());
phoneGroup.add(buildScreen());
phoneGroup.add(buildCameraModule());
phoneGroup.add(buildButtons());
phoneGroup.add(buildPorts());

/* ===================== 展示台 ===================== */
function buildStage() {
  const platformGeo = new THREE.CylinderGeometry(16, 16.5, 1, 96);
  const platformMat = new THREE.MeshPhysicalMaterial({
    color: 0x050505, metalness: 0.8, roughness: 0.3, clearcoat: 1.0, envMapIntensity: 1.0
  });
  const platform = new THREE.Mesh(platformGeo, platformMat);
  platform.position.y = -PHONE_HEIGHT/2 - 0.5;
  platform.receiveShadow = true;
  scene.add(platform);
}
buildStage();

/* ===================== 交互控制 ===================== */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 4;
controls.maxDistance = 80;
controls.target.set(0, 0, 0);
controls.maxPolarAngle = Math.PI * 0.85;
controls.minPolarAngle = Math.PI * 0.1;
controls.update();

let autoRotate = false;
document.getElementById('btnRotate').addEventListener('click', (e) => {
  autoRotate = !autoRotate;
  e.target.classList.toggle('active', autoRotate);
});

const CAM_START_RESET = CAM_START.clone();
let camAnim = null;
document.getElementById('btnReset').addEventListener('click', () => {
  camAnim = {
    fromPos: camera.position.clone(), toPos: CAM_START_RESET.clone(),
    fromTgt: controls.target.clone(), toTgt: new THREE.Vector3(0, 0, 0), t: 0
  };
  controls.enabled = false;
});

const swatchesEl = document.getElementById('swatches');
let activeIndex = 0;
COLORS.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'swatch' + (i === 0 ? ' active' : '');
  btn.style.background = c.ui;
  btn.title = c.name;
  btn.addEventListener('click', () => {
    if (i === activeIndex) return;
    activeIndex = i;
    tgtFrame.set(c.frame);
    tgtBack.set(c.back);
    [...swatchesEl.children].forEach((el, idx) => el.classList.toggle('active', idx === i));
  });
  swatchesEl.appendChild(btn);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ===================== 渲染循环 ===================== */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // 颜色平滑过渡
  const k = 1 - Math.pow(0.001, dt);
  curFrame.lerp(tgtFrame, k);
  curBack.lerp(tgtBack, k);
  MAT.frame.color.copy(curFrame);
  MAT.backGlass.color.copy(curBack);

  // 重置镜头动画
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 2.0);
    const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
    controls.target.lerpVectors(camAnim.fromTgt, camAnim.toTgt, e);
    if (camAnim.t >= 1) { camAnim = null; controls.enabled = true; }
  }

  controls.autoRotate = autoRotate;
  controls.update();
  renderer.render(scene, camera);
}

renderer.render(scene, camera);
animate();

requestAnimationFrame(() => {
  const loading = document.getElementById('loading');
  loading.classList.add('hide');
  setTimeout(() => loading.remove(), 800);
});
</script>
</body>
